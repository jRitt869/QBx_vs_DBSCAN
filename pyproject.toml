[project]
name = "gpx-track-clustering"
version = "0.1.0"
description = "An internship project comparing GPX trajectory clustering with QuickBundlesX and DBSCAN"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests", "historical/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["temp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
